plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.aurora_app"
    compileSdk = flutter.compileSdkVersion
    // Match Firebase plugins' requirement (backward compatible)
    ndkVersion = "25.1.8937393"

    compileOptions {
        // Use Java 17 and enable desugaring per plugin requirements
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.aurora_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Firebase Auth 23.x requires minSdkVersion >= 23
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// Force older AndroidX library versions compatible with AGP 8.2.1
configurations.all {
    resolutionStrategy {
        force 'androidx.browser:browser:1.7.0'
        // Bump core/core-ktx to include EditorInfoCompat.setStylusHandwritingEnabled
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.core:core:1.13.1'
    }
}

dependencies {
    // Desugaring support library
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
