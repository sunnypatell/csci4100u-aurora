name: Flutter Analyze & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurora_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Android prerequisite)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze